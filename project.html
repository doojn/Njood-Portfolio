<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Njood Albawardi | Project</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yt-bg: #ffffff;
            --yt-text: #0f0f11;
            --yt-gray: #606060;
            --yt-light-gray: #f2f2f2;
            --yt-border: #e5e5e5;
            --yt-blue: #065fd4;
            --font-primary: 'Roboto', 'IBM Plex Sans', sans-serif;
        }

        *, *::before, *::after {
            cursor: auto !important;
        }

        body {
            background-color: var(--yt-bg);
            color: var(--yt-text);
            font-family: var(--font-primary);
            margin: 0;
            cursor: auto !important;
        }

        a, button, [role="button"], input, select, .yt-nav *, .hover-target, video, .related-video {
            cursor: pointer !important;
        }

        /* Navbar */
        .yt-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 56px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .yt-logo {
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            color: var(--yt-text);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .yt-logo::before {
            content: '▶';
            color: red;
        }

        .youtube-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }
        @media (max-width: 1024px) {
            .youtube-layout {
                grid-template-columns: 1fr;
            }
        }
        .main-content .media-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .project-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--yt-text);
            line-height: 28px;
        }
        
        .channel-info-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--yt-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
        }
        .channel-details {
            display: flex;
            flex-direction: column;
            margin-right: 24px;
        }
        .channel-name {
            font-weight: 600;
            font-size: 16px;
        }
        .channel-subs {
            font-size: 12px;
            color: var(--yt-gray);
        }
        .subscribe-btn {
            background-color: #0f0f11;
            color: white;
            border: none;
            border-radius: 18px;
            padding: 0 16px;
            height: 36px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .project-description-box {
            background-color: var(--yt-light-gray);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            line-height: 20px;
            color: var(--yt-text);
        }
        .project-description-box span {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        
        .suggestions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .suggestion-card {
            display: grid;
            grid-template-columns: 168px 1fr;
            gap: 8px;
            text-decoration: none;
            color: inherit;
        }
        .sug-img {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
        }
        .sug-info {
            display: flex;
            flex-direction: column;
        }
        .sug-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            margin-bottom: 4px;
            color: var(--yt-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sug-domain {
            font-size: 12px;
            color: var(--yt-gray);
            line-height: 18px;
        }
    </style>
</head>
<body>
    <nav class="yt-nav">
        <a href="index.html" class="yt-logo">NjoodTube</a>
        <div style="display:flex; gap: 1rem; align-items:center;">
            <a href="index.html" style="text-decoration:none; color: var(--yt-gray); font-size:14px; font-weight:500;">← All Works</a>
            <a href="resume.html" target="_blank" style="text-decoration:none; color: var(--yt-blue); font-size:14px; font-weight:600; padding:6px 12px; border: 1px solid var(--yt-blue); border-radius: 18px;">CV / Resume ↗</a>
        </div>
    </nav>

    <main class="youtube-layout">
        <div class="main-content">
            <div class="media-container" id="main-media">
                <img src="" id="project-hero-img" alt="Project Media">
            </div>
            <h1 class="project-title" id="project-title">Project Title</h1>
            
            <div class="channel-info-row">
                <div class="channel-avatar">N</div>
                <div class="channel-details">
                    <span class="channel-name">Njood Albawardi</span>
                    <span class="channel-subs">1.2M subscribers</span>
                </div>
                <button class="subscribe-btn">Subscribe</button>
            </div>

            <div class="project-description-box">
                <span id="project-domain">120K views • Domain</span>
                <div id="project-desc">
                    Project description goes here.
                </div>
            </div>

            <div id="project-stills-gallery"></div>
        </div>

        <div class="suggestions" id="suggestions-list">
            <!-- Injected via JS -->
        </div>
    </main>

    <script src="js/project.js"></script>
</body>
</html>
